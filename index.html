<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Todo Studio · MO</title>
  <meta name="theme-color" content="#06050d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MO">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div class="weltraum" aria-hidden="true"></div>
  <canvas id="wolke" aria-label="MO und seine Agenten als Weltraumwolke. Mausrad oder zwei Finger zum Zoomen, Partikel antippen für Details."></canvas>

  <header class="kopf glas">
    <div class="marke">
      <span class="marke-punkt" id="markePunkt"></span>
      <div><h1>MO</h1><p id="kopfDatum">Todo Studio</p></div>
    </div>
    <div class="kopf-rechts">
      <span class="pille" id="pilleGoogle" title="Google-Skript (Aufgaben, Termine, Mails)"><i></i><span class="lang">Google</span><span class="kurz">G</span></span>
      <span class="pille" id="pilleZentrale" title="Zentrale auf dem Laptop"><i></i><span class="lang">Zentrale</span><span class="kurz">Z</span></span>
      <button class="icon-knopf" id="knopfHud" aria-pressed="true" aria-label="Seitenanzeigen an/aus" title="Seitenanzeigen">◫</button>
      <button class="icon-knopf" id="knopfStimme" aria-pressed="true" aria-label="Sprachausgabe an/aus" title="Sprachausgabe">🔊</button>
      <button class="icon-knopf" id="knopfNeuLaden" aria-label="Neu laden" title="Neu laden">⟳</button>
      <button class="icon-knopf" id="knopfEinstellungen" aria-label="Einstellungen" title="Einstellungen">⚙</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <!-- Seitenanzeigen um die Wolke (Laptop: links/rechts, Handy: Leiste unter dem Kopf) -->
  <aside class="hud hud-links" id="hudLinks" aria-label="Lage, Heute und Eingang"></aside>
  <aside class="hud hud-rechts" id="hudRechts" aria-label="Team und System"></aside>
  <nav class="hud-leiste" id="hudLeiste" aria-label="Kurzüberblick"></nav>

  <section class="schublade glas" id="schublade" hidden aria-labelledby="schubladeTitel">
    <div class="schublade-kopf">
      <h2 id="schubladeTitel">Heute</h2>
      <button class="icon-knopf" id="knopfSchliessen" aria-label="Schließen">✕</button>
    </div>
    <main id="inhalt" aria-live="polite"></main>
  </section>

  <section class="chat glas" id="chat" aria-label="Gespräch mit MO">
    <div class="chat-kopf">
      <h2>MO</h2>
      <div class="chat-kopf-rechts">
        <small id="chatStatus">bereit</small>
        <button type="button" class="gespraech-knopf" id="knopfGespraech" aria-pressed="false" title="Freihändig sprechen: MO hört nach jeder Antwort wieder zu">🎧 Gespräch</button>
        <button type="button" class="icon-knopf chat-zu" id="chatZu" aria-label="Chat einklappen" title="Einklappen">▾</button>
      </div>
    </div>
    <div class="live-arbeit" id="liveArbeit" hidden></div>
    <div class="verlauf" id="verlauf" aria-live="polite"></div>
    <form class="eingabe" id="eingabe" autocomplete="off">
      <div class="typ-wahl" id="typWahl" role="radiogroup" aria-label="Art der Notiz" hidden>
        <button type="button" data-typ="aufgabe" class="aktiv">Aufgabe</button>
        <button type="button" data-typ="termin">Termin</button>
        <button type="button" data-typ="idee">Idee</button>
      </div>
      <div class="eingabe-zeile">
        <button type="button" class="mikro" id="knopfMikro" aria-label="Sprechen">🎙</button>
        <textarea id="eingabeText" rows="1" enterkeyhint="send" placeholder="Womit kann ich dienen?"></textarea>
        <button type="submit" class="senden" aria-label="Senden">➤</button>
      </div>
      <p class="eingabe-hinweis" id="eingabeHinweis" hidden></p>
    </form>
  </section>

  <!-- Handy: der Chat ist eingeklappt, damit die Wolke Platz hat; dieser Knopf klappt ihn auf -->
  <button type="button" class="chat-knopf glas" id="chatKnopf" aria-controls="chat" aria-expanded="false" aria-label="Chat mit MO öffnen"><span>✦</span><em class="zaehler" id="chatZaehler" hidden></em></button>

  <nav class="dock glas" id="dock" aria-label="Bereiche">
    <button data-ansicht="jarvis" class="aktiv"><span>✦</span>MO</button>
    <button data-ansicht="heute"><span>☀</span>Heute</button>
    <button data-ansicht="aufgaben"><span>✓</span>Aufgaben</button>
    <button data-ansicht="termine"><span>◷</span>Termine</button>
    <button data-ansicht="ideen"><span>✧</span>Ideen</button>
    <button data-ansicht="mails"><span>✉</span>Mails</button>
    <button data-ansicht="sitzungen"><span>⌘</span>Arbeit<em class="zaehler" id="zaehlerFreigaben" hidden></em></button>
  </nav>

  <div class="agent-karte glas" id="agentKarte" hidden></div>
  <dialog id="dialog"><form method="dialog" id="dialogInhalt"></form></dialog>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="planer.js"></script>
  <script src="demo.js"></script>
  <script src="demo-katalog.js"></script>
  <script src="demo-zentrale.js"></script>
  <script src="studio.js"></script>
  <script src="push.js"></script>
  <script src="weckwort.js"></script>
  <script src="jarvis.js"></script>
  <script src="hud.js"></script>
  <script type="module" src="wolke.js"></script>
</body>
</html>
